name: Publish playable Web demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download preserved Web build
        env:
          RELEASE_ROOT: https://github.com/KOSEIHAMAYA2077/one-board-incremental/releases/download/v0.6.1-web
        run: |
          curl --fail --location --retry 3 "$RELEASE_ROOT/OneBoardMomentumLab-v0.6.1-Web.zip" -o OneBoardMomentumLab-v0.6.1-Web.zip
          curl --fail --location --retry 3 "$RELEASE_ROOT/OneBoardMomentumLab-v0.6.1-Web.zip.sha256" -o OneBoardMomentumLab-v0.6.1-Web.zip.sha256
          sha256sum --check OneBoardMomentumLab-v0.6.1-Web.zip.sha256
          mkdir site
          unzip -q OneBoardMomentumLab-v0.6.1-Web.zip -d site
          test -f site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
